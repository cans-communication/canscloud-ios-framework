name: Claude Review (per-user token)

on:
  issue_comment:
    types: [created]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: cans-communication/cans-git-action/.github/workflows/claude-review.yaml@v3.2.0
    secrets: inherit
